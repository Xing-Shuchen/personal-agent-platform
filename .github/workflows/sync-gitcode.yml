name: Sync Mirror from GitCode

on:
  schedule:
    # 每 3 小时执行一次（UTC）
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-gitcode
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sync GitCode to GitHub
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GH_MIRROR_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          if [ -z "$GITCODE_TOKEN" ]; then
            echo 'Missing repository secret: GITCODE_TOKEN' >&2
            exit 1
          fi
          if [ -z "$GH_MIRROR_TOKEN" ]; then
            echo 'Missing repository secret: GH_MIRROR_TOKEN' >&2
            exit 1
          fi

          # 只抓取需要镜像的 refs，避免 GitCode 内部 refs 进入推送范围。
          mkdir upstream.git
          cd upstream.git
          git init --bare
          git -c http.extraheader="Authorization: Basic $(printf 'oauth2:%s' "$GITCODE_TOKEN" | base64 -w0)" \
            fetch --no-tags 'https://gitcode.com/shuchen_xing/personal-agent-platform.git' \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

          git remote add github "https://github.com/${{ github.repository }}.git"
          git config "http.https://github.com/${{ github.repository }}.git.extraheader" \
            "Authorization: Basic $(printf 'x-access-token:%s' "$GH_MIRROR_TOKEN" | base64 -w0)"

          # GitCode 删除的分支和标签也从 GitHub 镜像中删除。
          git push --prune --force github 'refs/heads/*:refs/heads/*'
          git push --prune --force github 'refs/tags/*:refs/tags/*'
