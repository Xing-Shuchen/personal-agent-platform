apiVersion: pap/v1
kind: Agent
metadata:
  name: personal-historian
  description: Produces validated, provenance-bound personal historical cards and period summaries.
spec:
  # Model policy belongs to PAP (§35). Declaring it here is what lets the runtime
  # record an authoritative model/provider in artifact provenance (§21) and what
  # PAP reports in each RunRecord (§31), instead of both being unknown.
  model: deepseek/deepseek-flash
  profile:
    name: personal-historian
    source: profile
  capabilities:
    - local_state.read
    - local_state.write
  proactive:
    enabled: true
    class: ambient
    desired_jobs:
      - name: historian-event-card-refresh
        schedule: "17 1 * * *"
        timezone: Asia/Shanghai
        skill: historian-event-card
        runtime: historian
        args: {mode: refresh}
        attach_to_session: false
        delivery: local
      - name: historian-thread-weekly-update
        schedule: "47 1 * * 1"
        timezone: Asia/Shanghai
        skill: historian-thread-card
        runtime: historian
        args: {mode: weekly-update}
        attach_to_session: false
        delivery: local
      - name: historian-weekly-summary
        schedule: "17 2 * * 1"
        timezone: Asia/Shanghai
        skill: historian-period-summary
        runtime: historian
        args: {kind: week, period: previous, timezone: Asia/Shanghai}
        attach_to_session: false
        delivery: local
      - name: historian-monthly-summary
        schedule: "37 3 1 * *"
        timezone: Asia/Shanghai
        skill: historian-period-summary
        runtime: historian
        args: {kind: month, period: previous, timezone: Asia/Shanghai}
        attach_to_session: false
        delivery: local
      - name: historian-quarterly-summary
        schedule: "17 4 1 1,4,7,10 *"
        timezone: Asia/Shanghai
        skill: historian-period-summary
        runtime: historian
        args: {kind: quarter, period: previous, timezone: Asia/Shanghai}
        attach_to_session: false
        delivery: local
      - name: historian-halfyear-summary
        schedule: "37 5 1 1,7 *"
        timezone: Asia/Shanghai
        skill: historian-period-summary
        runtime: historian
        args: {kind: halfyear, period: previous, timezone: Asia/Shanghai}
        attach_to_session: false
        delivery: local
  state:
    private:
      - runs
      - locks
      - cache
      - state
