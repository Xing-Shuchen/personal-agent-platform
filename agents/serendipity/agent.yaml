apiVersion: pap/v1
kind: Agent
metadata:
  name: serendipity
  description: Surfaces rare, non-obvious connections across the user's own history and current context.
spec:
  enabled: false  # Set locally in var/config/agents.yaml after setup
  profile:
    name: serendipity
    source: profile
  capabilities:
    - personal_context.read
    - local_state.write
  proactive:
    enabled: true
    class: conversational
    desired_jobs:
      - name: serendipity-pulse
        enabled: true
        schedule: "15 2,5,8,11,14,17,20,23 * * *"
        skill: proactive-serendipity
        runtime: cognition
        attach_to_session: true
        delivery: user-home
  state:
    private:
      - candidate-connections
      - delivered-connections
      - feedback
