apiVersion: pap/v1
kind: Agent
metadata:
  name: serendipity
  description: Surfaces rare, non-obvious connections across the user's own history and current context.
spec:
  profile:
    name: serendipity
    source: profile
  model: zai-intelligence-serendipity/glm-5.2
  capabilities:
    - personal_context.read
    - local_state.write
  proactive:
    enabled: true
    class: conversational
    desired_jobs:
      - name: serendipity-pulse
        enabled: true
        schedule: "15 2,8,14,20 * * *"
        skill: proactive-serendipity
        attach_to_session: true
        delivery: user-home
  state:
    private:
      - candidate-connections
      - delivered-connections
      - feedback
