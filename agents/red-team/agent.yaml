apiVersion: pap/v1
kind: Agent
metadata:
  name: red-team
  description: Adversarial reviewer for arguments, designs, assumptions and plans.
spec:
  enabled: false  # Set locally in var/config/agents.yaml after setup
  profile:
    name: red-team
    source: profile
  capabilities:
    - personal_context.read
    - web.read
    - repo.read
    - local_state.write
  proactive:
    enabled: false
  state:
    private:
      - claim-ledger
      - unresolved-challenges
