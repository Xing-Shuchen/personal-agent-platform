apiVersion: pap/v1
kind: Agent
metadata:
  name: wechat-archivist
  description: 从用户明确配置的本地微信数据库增量归档聊天记录。
spec:
  enabled: false  # Set locally in var/config/agents.yaml after setup
  profile:
    name: wechat-archivist
    source: profile
  capabilities:
    - local_state.write
  proactive:
    enabled: true
    class: ambient
    desired_jobs:
      - name: wechat-daily-incremental
        schedule: "15 3 * * *"
        skill: wechat-daily-incremental
        args: {}
        attach_to_session: false
        delivery: local
  state:
    private:
      - messages.jsonl
      - checkpoint.json
      - run-log.jsonl
