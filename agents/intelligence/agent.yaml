apiVersion: pap/v1
kind: Agent
metadata:
  name: intelligence
  description: Monitors external developments and reports only information likely to update the user's world model.
spec:
  enabled: false  # Set locally in var/config/agents.yaml after setup
  profile:
    name: intelligence
    source: profile
  capabilities:
    - personal_context.read
    - web.search
    - web.read
    - local_state.write
  proactive:
    enabled: true
    class: conversational
    desired_jobs:
      - name: intelligence-pulse
        enabled: true
        schedule: "10 1,7,13,19,22 * * *"
        skill: intelligence-brief
        runtime: cognition
        attach_to_session: true
        delivery: user-home
  state:
    private:
      - watchlist
      - source-registry
      - story-clusters
      - alert-history
      - open-questions
