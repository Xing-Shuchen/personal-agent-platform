# Cadre Tracker runtime configuration (tracked defaults; no personal paths or credentials)

database:
  # Default resolves to ${PAP_DATA_DIR}/cadre-tracker/cadre.sqlite3 or var/cadre-tracker/cadre.sqlite3
  filename: cadre.sqlite3

retirement:
  # Standard statutory retirement age thresholds used by GovDomSentinel anomaly checks
  vice_ministerial_age: 60
  ministerial_age: 65
  national_age: 68
  recent_transfer_window_days: 14

shockwave:
  max_overlap_months_cap: 60
  topology_weights:
    same_org_leader: 3.0
    same_org_peer: 2.0
    parent_child_direct: 2.2
    two_hop_subordinate: 1.0
  recency_weights:
    within_5_years: 1.2
    within_12_years: 1.0
    older_than_12_years: 0.6
  bonuses:
    same_school_and_dept: 15.0
    central_party_school_cohort: 20.0
    same_school_only: 6.0
    direct_chief_succession: 25.0

sources:
  ccdi:
    enabled: true
    credibility_tier: 1
    endpoints:
      - name: 中纪委审查调查-中管干部
        source_type: ccdi_investigation
        url: https://www.ccdi.gov.cn/scdcn/zggb/zjsc/
      - name: 中纪委党纪政务处分-中管干部
        source_type: ccdi_sanction
        url: https://www.ccdi.gov.cn/scdcn/zggb/djcf/
  appoint:
    enabled: true
    credibility_tier: 1
    endpoints:
      - name: 人社部国务院任免
        source_type: hrss_appoint
        url: https://www.mohrss.gov.cn/SYrlzyhshbzb/dongtaixinwen/buneiyaowen/
      - name: 新华网人事任免
        source_type: xinhua_appoint
        url: http://www.news.cn/politics/rs.htm
  wiki:
    enabled: true
    credibility_tier: 3
    mediawiki_api: https://zh.wikipedia.org/w/api.php
    wikidata_sparql: https://query.wikidata.org/sparql
    watched_categories:
      - Category:中国共产党第二十届中央委员会委员
      - Category:中国共产党第二十届中央委员会候补委员
      - Category:受处分的中国共产党党员
  deep_media:
    enabled: true
    credibility_tier: 2
    keywords:
      - 履新
      - 落马
      - 被查
      - 双开
      - 免职
      - 投案
      - 常委
      - 副省长
      - 副部长
      - 审查调查
    feeds: []  # Configure local RSS feed URLs in ignored var/config/ if desired
  gov_dom_targets: []  # Seeded into gov_roster_targets table or configured locally
