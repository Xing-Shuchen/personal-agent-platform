apiVersion: pap/v1
kind: Agent
metadata:
  name: world-historian
  description: Preserves evolving external-world events as sourced claims, revisable events, and long-running threads.
spec:
  enabled: false  # Set locally in var/config/agents.yaml after setup
  profile:
    name: world-historian
    source: profile
  capabilities:
    - personal_context.read
    - web.search
    - web.read
    - local_state.write
    - proactive_message.write
  proactive:
    enabled: true
    class: ambient
    desired_jobs:
      - name: world-follow-high
        schedule: "43 0,6,12,18 * * *"
        model: qwen/qwen3.8-max
        skill: news-follow
        args:
          priority: high
        attach_to_session: false
        delivery: user-home
      - name: world-feeds
        schedule: "10 0-8,12-13,18-23 * * *"
        skill: news-feeds
        args: {}
        attach_to_session: false
        delivery: local
        runner: command
        command:
          - python3
          - agents/world-historian/runtime/cli.py
          - feeds
          - update
      - name: world-chronicle-snapshot
        schedule: "23 9 * * *"
        skill: chronicle-snapshot
        args: {}
        attach_to_session: false
        delivery: local
        runner: command
        command:
          - bash
          - scripts/sync_chronicle_snapshot.sh
        enabled: false
      - name: world-follow-normal
        schedule: "43 3,13,22 * * *"
        model: qwen/qwen3.8-max
        skill: news-follow
        args:
          priority: normal
        attach_to_session: false
        delivery: user-home
      - name: world-follow-low
        schedule: "43 20 * * *"
        model: qwen/qwen3.8-max
        skill: news-follow
        args:
          priority: low
        attach_to_session: false
        delivery: user-home
      - name: world-follow-background
        schedule: "43 20 * * 6"
        skill: news-follow
        args:
          priority: background
        attach_to_session: false
        delivery: user-home
      - name: world-reflect
        schedule: "20 2 * * *"
        skill: news-reflect
        args:
          window: 30d
        attach_to_session: false
        delivery: local
      - name: world-crosslink
        schedule: "50 2 * * *"
        skill: personal-crosslink
        args:
          window: 7d
        attach_to_session: false
        delivery: local
      - name: world-morning-brief
        schedule: "0 7 * * *"
        skill: news-morning-brief
        args: {}
        attach_to_session: true
        delivery: user-home
        deliver_at: "08:00"
      - name: world-daily-report
        schedule: "0 0 * * *"
        skill: news-daily-stats
        args: {}
        attach_to_session: true
        delivery: user-home
      - name: world-weekly-report
        schedule: "0 22 * * 0"
        skill: news-synthesize
        args:
          mode: weekly
        attach_to_session: true
        delivery: user-home
  state:
    private:
      - chronicle.sqlite
      - raw-source-snapshots
      - reports
      - personal-links
      - search-cache
