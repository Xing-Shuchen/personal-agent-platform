apiVersion: pap/v1
kind: Agent
metadata:
  name: world-historian
  description: Preserves evolving external-world events as sourced claims, revisable events, and long-running threads.
spec:
  profile:
    name: world-historian
    source: profile
  model: deepseek-world-historian/deepseek-flash
  capabilities:
    - personal_context.read
    - web.search
    - web.read
    - local_state.write
    - proactive_message.write
  proactive:
    enabled: true
    class: ambient
    desired_jobs:
      - name: world-follow-high
        schedule: "43 0,6,12,18 * * *"
        skill: news-follow
        args:
          priority: high
        attach_to_session: false
        delivery: user-home
      - name: world-feeds
        schedule: "10 0-8,12-13,18-23 * * *"
        skill: news-feeds
        args: {}
        attach_to_session: false
        delivery: local
      - name: world-follow-normal
        schedule: "43 3,13,21 * * *"
        skill: news-follow
        args:
          priority: normal
        attach_to_session: false
        delivery: user-home
      - name: world-follow-low
        schedule: "43 20 * * *"
        skill: news-follow
        args:
          priority: low
        attach_to_session: false
        delivery: user-home
      - name: world-follow-background
        schedule: "every 14d from 2026-09-12 20:43 tz Asia/Shanghai"
        skill: news-follow
        args:
          priority: background
        attach_to_session: false
        delivery: user-home
      - name: world-reflect
        schedule: "20 2 * * *"
        skill: news-reflect
        args:
          window: 30d
        attach_to_session: false
        delivery: local
      - name: world-crosslink
        schedule: "50 2 * * *"
        skill: personal-crosslink
        args:
          window: 7d
        attach_to_session: false
        delivery: local
      - name: world-morning-brief
        schedule: "0 8 * * *"
        skill: news-morning-brief
        args: {}
        attach_to_session: true
        delivery: user-home
      - name: world-daily-report
        schedule: "0 0 * * *"
        skill: news-daily-stats
        args: {}
        attach_to_session: true
        delivery: user-home
      - name: world-weekly-report
        schedule: "0 20 * * 0"
        skill: news-synthesize
        args:
          mode: weekly
        attach_to_session: true
        delivery: user-home
  state:
    private:
      - chronicle.sqlite
      - raw-source-snapshots
      - reports
      - personal-links
      - search-cache
