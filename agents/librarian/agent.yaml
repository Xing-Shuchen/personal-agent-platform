apiVersion: pap/v1
kind: Agent
metadata:
  name: librarian
  description: Captures reading evidence and retrieves provenance-bound reading traces.
spec:
  enabled: false  # Set locally in var/config/agents.yaml after setup
  profile:
    name: librarian
    source: profile
  capabilities:
    - local_state.read
    - local_state.write
  proactive:
    enabled: false
  state:
    private:
      - objects
      - librarian.sqlite
