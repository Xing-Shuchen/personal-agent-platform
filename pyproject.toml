[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pap"
version = "0.7.0"
description = "Personal Agent Platform: declarative agents, scheduling, run audit, and proactive gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0", "sentence-transformers>=5.0,<6", "jsonschema>=4.10,<5", "Pillow>=10,<12"]

[project.optional-dependencies]
# `make test` collects tests that import bookscan (cv2/lxml) and the librarian
# runtime (rapidfuzz); a fresh `make setup` must install them or collection fails.
test = ["pytest>=8", "opencv-python>=4.10", "lxml>=5", "rapidfuzz>=3"]

[project.scripts]
pap = "pap.cli:main"
paplog = "paplog.cli:main"

[tool.setuptools.packages.find]
include = ["pap*", "paplog*"]

[tool.setuptools.package-data]
paplog = ["*.json"]

[tool.pytest.ini_options]
# The office-floor Python projector tests ship beside the TypeScript contract
# tests; collect them too so `make test` covers everything runnable offline.
testpaths = ["tests", "agent-office-floor/tests"]
