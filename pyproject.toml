[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pap"
version = "0.5.0"
description = "Personal Agent Platform: declarative agents, scheduling, run audit, and proactive gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.scripts]
pap = "pap.cli:main"
paplog = "paplog.cli:main"

[tool.setuptools.packages.find]
include = ["pap*", "paplog*"]

[tool.setuptools.package-data]
paplog = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
